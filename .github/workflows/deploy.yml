name: Deploy Frontend & Backend to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: ?? Build & Deploy Frontend (bhaktachintamani.gt.tc)
    runs-on: ubuntu-latest

    steps:
      - name: ?? Checkout Repository
        uses: actions/checkout@v4

      - name: ?? Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: ?? Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: ?? Sync Frontend to bhaktachintamani.gt.tc/htdocs/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: bhaktachintamani.gt.tc/htdocs/

  deploy-backend:
    name: ?? Deploy Backend API (bhaktachintamani.freedev.app)
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: ?? Checkout Repository
        uses: actions/checkout@v4

      - name: ?? Sync Backend to htdocs/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**
            storage/logs/**
            .env
