name: Deploy to InfinityFree (bhaktachintamani.freedev.app)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-all:
    name: Build & Deploy to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend (Production)
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: https://bhaktachintamani.freedev.app

      - name: Copy built frontend into backend/public
        run: |
          cp -r frontend/dist/. backend/public/

      - name: Sync Backend + Frontend to freedev.app (Main App & API)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**
            storage/logs/**
            .env
            tests/**
